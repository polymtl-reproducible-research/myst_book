name: MyST GitHub Pages Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Also allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  BASE_URL: /${{ github.event.pull_request.number || 'main' }}

jobs:
  deploy:
    environment:
      name: gh-pages
      url: https://reproducible-research.polymtl.ca${{ env.BASE_URL }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install MyST
        run: npm install -g mystmd

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install deep-translator pyyaml

      - name: Build English book
        run: myst build --html

      - name: Translate and build French book
        run: python3 scripts/build-french.py

      - name: Inject language switcher
        run: python3 scripts/inject-language-switcher.py

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
          # Version 4.1.0, pinned by commit hash since it's a third-party action
          # We use peaceiris/actions-gh-pages instead of actions/deploy-pages
          # because of the `destination_dir` option, which lets us keep the
          # files from other deployments in other sub-directories.
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html/
          destination_dir: ${{ env.BASE_URL }}
