name: MyST GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # This allows manual runs from any commit/branch

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install MyST
        run: npm install -g mystmd

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install deep-translator pyyaml

      - name: Build English book
        run: myst build --html

      - name: Translate and build French book
        run: python3 scripts/build-french.py

      - name: Inject language switcher
        run: python3 scripts/inject-language-switcher.py

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: gh-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@v5
