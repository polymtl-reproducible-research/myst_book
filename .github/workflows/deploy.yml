name: MyST GitHub Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # This allows manual runs from any commit/branch

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout translation cache
        uses: actions/checkout@v7
        with:
          ref: translation-cache
          path: .tcache
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install MyST
        run: npm install -g mystmd

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install deep-translator pyyaml

      - name: Build English book
        run: myst build --html

      - name: Translate and build French book
        run: python3 scripts/build-french.py --cache .tcache/fr.cache.json

      - name: Open or update an issue if the deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Deploy is failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="The deploy failed again on [this run]($RUN_URL). This blocks the whole site from updating (English included) until it's fixed.

          The usual cause is the French build hitting a Google Translate rate limit on the free endpoint -- re-running the workflow once it clears often fixes it. If specific strings keep failing, pin them in \`translations/fr.overrides.json\` (see \`scripts/TRANSLATION.md\` for how)."
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Close the deploy-is-failing issue if now fixed
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Deploy is failing"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Fixed by a later successful run: $RUN_URL"
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          fi

      - name: Commit refreshed translation cache
        if: always()
        continue-on-error: true
        working-directory: .tcache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fr.cache.json
          if git diff --cached --quiet; then
            echo "cache unchanged"
          else
            git commit -m "Update French translation cache [skip ci]"
            git pull --rebase origin translation-cache || echo "no existing cache branch; creating it"
            git push origin HEAD:translation-cache
          fi

      - name: Inject language switcher
        run: python3 scripts/inject-language-switcher.py

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: gh-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the artifact
        id: deployment
        uses: actions/deploy-pages@v5
